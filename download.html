<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TI Downloader - Choose download folder</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body class="download-window">
    <header><h1>Choose download folder <span id="version"></span></h1></header>
    <main>
      <p id="status" role="status">Checking the download folder...</p>
      <p class="save-help">You can change the download folder later from the TI Downloader popup.</p>
    </main>
    <footer>
      <button id="choose-folder" class="primary" type="button" disabled>Choose folder and download</button>
      <button id="close" type="button">Cancel</button>
    </footer>
    <script src="folder-store.js"></script>
    <script src="download.js"></script>
  </body>
</html>
